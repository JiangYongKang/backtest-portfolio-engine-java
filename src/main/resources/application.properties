# 回测引擎配置
# 基准币种（多币种持仓/现金最终折算到该币种）
backtest.base-currency=USD
# 行情新鲜窗口：最新 tick 早于估值时点超过该时长 -> STALE_PRICE（停牌另判 SUSPENDED）
backtest.price-stale-tolerance=PT5M
# 汇率过期窗口：超过该时长的汇率不允许沿用 -> FX_STALE
backtest.fx-stale-tolerance=PT24H
# 成本模型
backtest.cost.commission-rate=0.0003
backtest.cost.commission-min=5.00
backtest.cost.tax-rate=0.001
backtest.cost.tax-on-sell-only=true
backtest.cost.slippage-rate=0.0005
# 每单佣金预留上界（覆盖多笔部分成交各自的最低佣金）
backtest.cost.commission-reserve-per-order=20.00

spring.jackson.serialization.write-dates-as-timestamps=false
